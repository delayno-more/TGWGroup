name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]   # 当 main 分支有推送时触发
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v2

      - name: 设置 Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18
          cache: 'npm'

      - name: 安装依赖
        run: npm ci          # 比 npm install 更适合 CI 环境

      - name: 构建项目
        run: npm run build   # 执行 vite build，生成 dist 文件夹

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./dist       # 将 dist 目录作为 Pages 的静态文件

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4