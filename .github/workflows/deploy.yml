name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v3          # 使用 v3，稳定可靠

      - name: 设置 Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # ---------- 中国大陆优化部分 ----------
      - name: 配置 npm 镜像（淘宝/阿里云）
        run: |
          npm config set registry https://registry.npmmirror.com
          npm config set disturl https://npmmirror.com/mirrors/node
          npm config set electron_mirror https://npmmirror.com/mirrors/electron/
          npm config set puppeteer_download_host https://npmmirror.com/mirrors
          npm config set chromedriver_cdnurl https://npmmirror.com/mirrors/chromedriver
          npm config set operadriver_cdnurl https://npmmirror.com/mirrors/operadriver
          npm config set phantomjs_cdnurl https://npmmirror.com/mirrors/phantomjs
          npm config set sass_binary_site https://npmmirror.com/mirrors/node-sass
          npm config set sqlite3_binary_host_mirror https://npmmirror.com/mirrors
          npm config set python_mirror https://npmmirror.com/mirrors/python
      # --------------------------------------

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmmirror.com   # 确保使用镜像

      - name: 构建项目
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v2   # v2 稳定，也可尝试 v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # 如果不需要显示环境，可以删掉 environment 字段
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4          # 此 action 也尽量使用 @v3 或 @v4